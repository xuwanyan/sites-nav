services:
  mysql:
    # 用户与权限存储。站点数据仍在 ./data（容器只读挂载），两者互不影响。
    #
    # 用 profiles 做开关：deploy.sh / bootstrap.sh 读 .env 的 MYSQL_HOST，
    # 值为 mysql 时 export COMPOSE_PROFILES=builtin-mysql 激活本服务；
    # 指向已有 MySQL 时不激活。**两种部署方式切换只改 .env，本文件不用动。**
    profiles: ["builtin-mysql"]
    image: mysql:8.0
    restart: unless-stopped
    environment:
      # 用 :- 而不是 :?：:? 在 profile 未激活时也会触发变量校验，
      # 会让"用已有 MySQL"的场景整个 compose 配置直接失败。
      # 空值时 mysql 容器自己拒绝启动（"root password ... is not set"），
      # docker compose logs mysql 能看到原因；deploy.sh 在内置场景下会先生成这两个值。
      # 注意：这两个只在数据卷首次初始化时生效，之后改 .env 不会改已创建的账号
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sites_nav}
      MYSQL_USER: ${MYSQL_USER:-sites_nav}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql_data:/var/lib/mysql
    # 故意不发布端口到宿主机：只让 sites-nav 通过 compose 内部网络访问。
    # 确需外部工具连库时再加 ports: - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 15s

  sites-nav:
    build: .
    image: sites-nav:latest
    # 不设 container_name：允许同名镜像多实例；需要固定名可手动加
    # Linux 上 Docker 不会注入 host.docker.internal（macOS/Windows 才会）。
    # 同一台宿主机装了 MySQL 时 .env 要用 host.docker.internal，没这行会解析失败、
    # 报 2003 Can't connect to MySQL server。host-gateway 需要 Docker 20.10+；
    # 更老版本（CentOS 7 常见的 19.03）改成 host.docker.internal:172.17.0.1。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # 宿主端口可配（.env 里写 PORT=8080 即生效），容器内固定 8000
      - "${PORT:-8000}:8000"
    # 从 .env 读取所有变量（含未来新增的），避免硬编码白名单漏掉新变量
    env_file: .env
    # 东八区。app.py 的 _now() 已显式指定 Asia/Shanghai，这里再设一份是双保险：
    # 没这行时容器是 UTC，任何漏掉显式时区的地方（含 Python 的 time.strftime）都会差 8 小时。
    # 必须是 environment: 下的键 —— TZ 不是 service 级配置项，写在外层 compose 会直接报错
    # "contains an unknown configuration option: TZ"，整个配置文件加载失败。
    environment:
      TZ: Asia/Shanghai
    # 故意不用 depends_on：mysql 是 profile 开关服务，未激活时依赖它会报
    # "service sites-nav depends on service mysql which is defined as a profile
    #  that is not active"。启动顺序交给应用侧处理 —— app.py 的 _init_db
    # 会重试 30 秒等 MySQL 就绪，连不上才中止启动（配 restart: unless-stopped
    # 会自动重试），效果等同 depends_on 且两种部署方式都不用改本文件。
    volumes:
      - ./data:/app/data          # 站点数据持久化，备份即复制 ./data/sites.json
    restart: unless-stopped
    # ── 容器加固 ──
    read_only: true               # 文件系统只读，只有 ./data 可写
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    healthcheck:
      # /health 会查 MySQL，数据库不通时返回 503 → 容器标为 unhealthy
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/health', timeout=5); sys.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  # mysql 服务未激活时这个卷仍会被声明（空卷，无害），
  # 这样从"已有 MySQL"切回内置时不用回来补这一行
  mysql_data:
