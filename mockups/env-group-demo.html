<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>示意 · 方案一：同名站点按环境聚合</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:#f0f2f5; color:#333; }
  .notice { background:#fffbe6; border-bottom:1px solid #ffe58f; color:#ad6800; font-size:12px; padding:7px 20px; text-align:center; }
  .layout { display:flex; min-height:calc(100vh - 28px); }
  aside { width:220px; flex-shrink:0; background:#fff; border-right:1px solid #e8e8e8; padding:14px 10px; }
  aside h3 { font-size:12px; color:#8c8c8c; font-weight:500; letter-spacing:1px; padding:0 10px 8px; }
  .cat-item { display:flex; align-items:center; gap:8px; padding:8px 12px; border-radius:8px; cursor:pointer; font-size:13.5px; margin-bottom:2px; }
  .cat-item:hover { background:#f5f5f5; }
  .cat-item.active { background:#e6f4ff; color:#1677ff; font-weight:600; }
  .cat-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .cat-name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cat-count { font-size:12px; color:#8c8c8c; background:#f0f0f0; border-radius:10px; padding:0 7px; line-height:18px; }
  .cat-item.active .cat-count { background:#bae0ff; color:#1677ff; }
  main { flex:1; padding:18px 24px; min-width:0; }
  .envbar { display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; align-items:center; }
  .chip { padding:6px 14px; background:#fff; border:1px solid #d9d9d9; border-radius:18px; font-size:13px; cursor:pointer; }
  .chip:hover { border-color:#1677ff; color:#1677ff; }
  .chip.active { background:#1677ff; border-color:#1677ff; color:#fff; font-weight:600; }
  .toggle { margin-left:auto; font-size:12px; color:#1677ff; cursor:pointer; border:1px solid #d6e4ff; background:#f0f5ff; border-radius:6px; padding:5px 10px; }
  .toggle:hover { background:#e6f4ff; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px; }

  .card { background:#fff; border-radius:10px; border:1px solid #e8e8e8; border-top:3px solid #1677ff; padding:14px 16px; }
  .card.single { border-top-color:#999; }
  .card-head { display:flex; align-items:center; gap:6px; margin-bottom:4px; }
  .card-name { font-size:15px; font-weight:600; flex:1 1 auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tag { font-size:11px; padding:1px 7px; border-radius:4px; flex-shrink:0; }
  .t-prod { background:#f6ffed; color:#389e0d; border:1px solid #b7eb8f; }
  .t-test { background:#fff7e6; color:#d46b08; border:1px solid #ffd591; }
  .meta-row { display:flex; align-items:center; gap:6px; margin-bottom:8px; font-size:12px; color:#8c8c8c; }
  .cat-chip { font-size:11px; padding:1px 7px; border-radius:4px; color:#fff; }

  .env-col { border:1px solid #f0f0f0; border-radius:8px; margin-bottom:8px; overflow:hidden; }
  .env-col-head { display:flex; align-items:center; justify-content:space-between; font-size:12px; padding:5px 9px; background:#fafafa; }
  .env-col-head .env-label { font-weight:600; }
  .env-col-head .env-label.prod { color:#389e0d; }
  .env-col-head .env-label.test { color:#d46b08; }
  .env-col-head .env-actions { display:flex; gap:6px; }
  .env-col-head .env-actions a { font-size:11px; color:#1677ff; cursor:pointer; }
  .env-col-head .env-actions a:hover { text-decoration:underline; }
  .url-row { display:flex; justify-content:space-between; align-items:center; font-size:12.5px; color:#555; padding:5px 9px; border-bottom:1px dashed #f0f0f0; }
  .url-row:last-child { border-bottom:none; }
  .url-row span:first-child { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .copy { color:#999; cursor:pointer; flex-shrink:0; }

  .demo-tip { margin-top:20px; font-size:12px; color:#999; text-align:center; line-height:1.8; }
  .demo-tip b { color:#1677ff; }
</style>
</head>
<body>
<div class="notice">📌 示意图 · 方案一：同名站点（如 GitLab 生产 + 测试）自动聚成一张分组卡，数据模型零改动</div>
<div class="layout">
  <aside>
    <h3>📂 分类目录</h3>
    <div id="catList"></div>
  </aside>
  <main>
    <div class="envbar">
      <span id="envBar"></span>
      <span class="toggle" id="grpToggle" onclick="toggleGroup()">🔗 分组卡模式</span>
    </div>
    <div class="grid" id="grid"></div>
    <div class="demo-tip">
      <b>说明：</b>同名站点（GitLab / Jenkins / Grafana）自动聚成一张「分组卡」，内部生产/测试分列显示。<br>
      点右上角<b>「🔗 分组卡模式」</b>可切换「拆开模式」，还原为各自独立的单卡。<br>
      左侧「生产环境」/「测试环境」筛选仍生效——筛选后分组卡只显示命中的一列。
    </div>
  </main>
</div>
<script>
const CATS = [["代码仓库","#1677ff"],["CI/CD","#722ed1"],["监控告警","#fa8c16"]];
const SITES = [
  {id:1,name:"GitLab",cat:"代码仓库",env:"生产环境",domain:"gitlab.company.com",inner:"http://10.0.1.10:8080",owner:"运维组",probe:true},
  {id:2,name:"GitLab",cat:"代码仓库",env:"测试环境",domain:"gitlab-test.company.com",inner:"http://10.0.1.11:8080",owner:"运维组",probe:false},
  {id:3,name:"Jenkins",cat:"CI/CD",env:"生产环境",domain:"jenkins.company.com",owner:"运维组",probe:true},
  {id:4,name:"Jenkins",cat:"CI/CD",env:"测试环境",domain:"jenkins-test.company.com",owner:"运维组",probe:false},
  {id:5,name:"ArgoCD",cat:"CI/CD",env:"生产环境",domain:"argocd.company.com",owner:"运维组",probe:true},
  {id:6,name:"Grafana",cat:"监控告警",env:"生产环境",domain:"grafana.company.com",owner:"运维组",probe:true},
  {id:7,name:"Grafana",cat:"监控告警",env:"测试环境",domain:"grafana-test.company.com",owner:"运维组",probe:false},
  {id:8,name:"Prometheus",cat:"监控告警",env:"生产环境",inner:"http://10.0.3.30:9090",owner:"运维组",probe:true},
  {id:9,name:"Nexus 制品私服",cat:"代码仓库",env:"生产环境",domain:"nexus.company.com",owner:"运维组",probe:true},
  {id:10,name:"SonarQube",cat:"CI/CD",env:"生产环境",domain:"sonar.company.com",owner:"质量组",probe:false},
];
let activeCat = "全部", activeEnv = "全部", groupMode = true;

const $ = id => document.getElementById(id);
const esc = s => (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const colorOf = c => (CATS.find(x=>x[0]===c)||[,"#999"])[1];

function catRow(key, color, label, n){
  return `<div class="cat-item ${activeCat===key?"active":""}" onclick="filterCat('${esc(key)}')">
    <span class="cat-dot" style="background:${color}"></span>
    <span class="cat-name">${label||esc(key)}</span><span class="cat-count">${n}</span></div>`;
}
function renderCats(){
  const pool = activeEnv==="全部"?SITES:SITES.filter(s=>s.env===activeEnv);
  const counts = {}; pool.forEach(s=>counts[s.cat]=(counts[s.cat]||0)+1);
  let h = catRow("全部","#8c8c8c","🗂 全部",pool.length);
  CATS.forEach(([c,col])=>h+=catRow(c,col,null,counts[c]||0));
  $("catList").innerHTML=h;
}
function renderEnvBar(){
  $("envBar").innerHTML=["全部","生产环境","测试环境"].map(e=>{
    const n=e==="全部"?SITES.length:SITES.filter(s=>s.env===e).length;
    const ico=e==="全部"?"🌐":e==="生产环境"?"🔴":"🟢";
    return `<span class="chip ${activeEnv===e?"active":""}" onclick="filterEnv('${e}')">${ico} ${e}<small style="font-weight:400;margin-left:3px;opacity:.7">(${n})</small></span>`;
  }).join("");
}

function urlRows(s){
  const rows=[["域名",s.domain],["公网",s.public],["内网",s.inner]].filter(r=>r[1]);
  if(!rows.length) return `<div class="url-row"><span>— 无地址 —</span></div>`;
  return rows.map(r=>`<div class="url-row"><span>${esc(r[1])}</span><span class="copy">📋</span></div>`).join("");
}
function envCol(s){
  const isProd = s.env==="生产环境";
  return `<div class="env-col">
    <div class="env-col-head">
      <span class="env-label ${isProd?"prod":"test"}">${isProd?"🔴 生产环境":"🟢 测试环境"}</span>
      <span class="env-actions">
        ${s.probe?'<span style="color:#389e0d;font-size:11px">📡 已监控</span>':''}
        <a onclick="alert('示意：编辑 ${esc(s.env)} 环境')">编辑</a>
      </span>
    </div>
    ${urlRows(s)}
  </div>`;
}

function card(s, color){
  return `<div class="card single" style="border-top-color:${color}">
    <div class="card-head">
      <span class="card-name">${esc(s.name)}</span>
      <span class="tag ${s.env==="生产环境"?"t-prod":"t-test"}">${s.env}</span>
    </div>
    <div class="meta-row"><span class="cat-chip" style="background:${color}">${esc(s.cat)}</span>
      <span>👤 ${esc(s.owner)}</span></div>
    ${urlRows(s)}
  </div>`;
}

function groupedCard(name, entries){
  // entries: [{env, sites:[...]}]  按生产、测试
  const color = entries[0].sites[0].cat && colorOf(entries[0].sites[0].cat);
  // 环境筛选：若只命中一个环境，只显示那一列
  const shown = entries.filter(e => activeEnv==="全部" || e.env===activeEnv);
  let cols = shown.map(e => {
    const heads = e.sites.map(s => {
      const isProd=e.env==="生产环境";
      return `<span class="env-label ${isProd?"prod":"test"}">${isProd?"🔴 生产":"🟢 测试"}</span>`;
    }).join("");
    return `<div class="env-col">
      <div class="env-col-head"><span>${heads}</span>
        <span class="env-actions">
          ${e.sites.some(s=>s.probe)?'<span style="color:#389e0d;font-size:11px">📡 已监控</span>':''}
          <a onclick="alert('示意：编辑『${esc(name)}』的${e.env}')">编辑</a>
        </span>
      </div>
      ${e.sites.map(s=>urlRows(s)).join("")}
    </div>`;
  }).join("");
  const prod = entries.find(e=>e.env==="生产环境");
  const test = entries.find(e=>e.env==="测试环境");
  const tags = [];
  if(prod && !test) tags.push('<span class="tag t-prod">生产</span>');
  else if(test && !prod) tags.push('<span class="tag t-test">测试</span>');
  else tags.push('<span class="tag t-prod">生产</span><span class="tag t-test">测试</span>');

  return `<div class="card" style="border-top-color:${color}">
    <div class="card-head">
      <span class="card-name">${esc(name)}</span>
      ${tags.join("")}
    </div>
    <div class="meta-row"><span class="cat-chip" style="background:${color}">${esc(entries[0].sites[0].cat)}</span>
      <span>👤 ${esc(entries[0].sites[0].owner)}</span></div>
    ${cols}
  </div>`;
}

function render(){
  renderCats(); renderEnvBar();
  const pool = SITES.filter(s => (activeCat==="全部"||s.cat===activeCat) && (activeEnv==="全部"||s.env===activeEnv));
  if(!pool.length){ $("grid").innerHTML='<p style="color:#999;text-align:center;padding:40px;grid-column:1/-1">没有匹配的系统</p>'; return; }

  let cards = "";
  if(groupMode){
    // 按站点名分组，环境列内部
    const groups = {};
    pool.forEach(s => {
      // 找这个 name 在全量数据里的所有环境（用于分组展示），但只显示当前 envBar 命中的环境
      if(!groups[s.name]) groups[s.name] = {sites:[], envs: new Set()};
      groups[s.name].sites.push(s);
      groups[s.name].envs.add(s.env);
    });
    Object.keys(groups).sort((a,b)=>a.localeCompare(b,"zh-CN")).forEach(name=>{
      const g = groups[name];
      const prod = g.sites.filter(s=>s.env==="生产环境");
      const test = g.sites.filter(s=>s.env==="测试环境");
      const entries = [];
      if(prod.length) entries.push({env:"生产环境", sites:prod});
      if(test.length) entries.push({env:"测试环境", sites:test});
      cards += entries.length>1 ? groupedCard(name, entries) : card(entries[0].sites[0], colorOf(g.sites[0].cat));
    });
  } else {
    // 拆开模式：按环境排序
    pool.slice().sort((a,b)=>(a.env==="生产环境"?0:1)-(b.env==="生产环境"?0:1)).forEach(s=>{
      cards += card(s, colorOf(s.cat));
    });
  }
  $("grid").innerHTML = cards;
  $("grpToggle").innerHTML = groupMode ? "🔗 分组卡模式" : "🔗 拆开模式";
}

function filterCat(c){ activeCat=c; render(); }
function filterEnv(e){ activeEnv=e; render(); }
function toggleGroup(){ groupMode=!groupMode; render(); }
render();
</script>
</body>
</html>
