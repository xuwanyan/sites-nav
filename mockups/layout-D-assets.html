<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>示意图 D · 布局A的延展：资产目录 + 物理机/虚拟机/网站关系</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:#f0f2f5; color:#333; }
  .notice { background:#fffbe6; border-bottom:1px solid #ffe58f; color:#ad6800; font-size:12px; padding:6px 20px; text-align:center; }
  .layout { display:flex; min-height:calc(100vh - 29px); }
  /* 左侧资产树 */
  aside { width:240px; flex-shrink:0; background:#fff; border-right:1px solid #e8e8e8; position:sticky; top:0; height:100vh; overflow-y:auto; padding:14px 10px; }
  .group-label { font-size:11px; color:#999; letter-spacing:1px; padding:14px 10px 6px; }
  .node { display:flex; align-items:center; gap:7px; padding:8px 10px; border-radius:8px; cursor:pointer; font-size:13.5px; }
  .node:hover { background:#f5f5f5; }
  .node.active { background:#e6f4ff; color:#1677ff; font-weight:600; }
  .node.lvl2 { padding-left:26px; }
  .node.lvl3 { padding-left:44px; font-size:12.5px; color:#666; }
  .node.active.lvl3 { color:#1677ff; }
  .twist { width:12px; color:#bbb; font-size:10px; flex-shrink:0; text-align:center; }
  .n-name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .n-count { font-size:11px; color:#8c8c8c; }
  /* 主区 */
  main { flex:1; padding:18px 22px; min-width:0; }
  .crumb { font-size:13px; color:#666; margin-bottom:12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:13px; align-content:start; }
  .card { background:#fff; border-radius:10px; border:1px solid #e8e8e8; border-top:3px solid #ddd; padding:13px 15px; }
  .card-header { display:flex; align-items:center; gap:6px; margin-bottom:6px; }
  .card-name { font-size:15px; font-weight:600; flex:1 1 auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tag { font-size:11px; padding:1px 7px; border-radius:4px; flex-shrink:0; }
  .t-prod { background:#f6ffed; color:#389e0d; border:1px solid #b7eb8f; }
  .t-test { background:#fff7e6; color:#d46b08; border:1px solid #ffd591; }
  .t-type { color:#fff; }
  .probe-tag { font-size:11px; color:#389e0d; background:#f6ffed; border:1px solid #b7eb8f; border-radius:4px; padding:1px 7px; margin-left:auto; flex-shrink:0; }
  .kv { display:flex; justify-content:space-between; font-size:12.5px; padding:4px 0; border-bottom:1px dashed #f0f0f0; }
  .kv:last-of-type { border-bottom:none; }
  .kv b { color:#888; font-weight:400; flex-shrink:0; margin-right:10px; }
  .kv span { color:#444; text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .deploy-row { margin-top:8px; font-size:12px; color:#666; background:#f0f5ff; border:1px solid #d6e4ff; border-radius:6px; padding:5px 9px; }
  .deploy-row b { color:#2f54eb; font-weight:500; cursor:pointer; }
  /* 物理机卡 */
  .card.phys { border-top-color:#fa541c; background:#fffbf5; }
  .vm-zone { margin-top:10px; background:#fff; border:1px solid #ffe7ba; border-radius:8px; padding:8px 10px; }
  .vm-zone-title { font-size:12px; color:#ad6800; margin-bottom:6px; }
  .vm-chip { display:flex; justify-content:space-between; align-items:center; font-size:12.5px; background:#fff7e6; border:1px solid #ffd591; border-radius:6px; padding:5px 9px; margin-bottom:4px; cursor:pointer; }
  .vm-chip:hover { border-color:#fa8c16; }
  .vm-chip b { font-weight:600; }
  .vm-chip span { color:#888; font-size:11.5px; }
  .legend { margin-top:16px; font-size:12px; color:#999; text-align:center; }
</style>
</head>
<body>
<div class="notice">📌 示意图 D = 布局A 的延展形态：左栏升级为「资产树」（网站服务 / 云资源 / 服务器资产·物理机→虚拟机），演示三层挂接关系</div>
<div class="layout">
  <aside><div id="tree"></div></aside>
  <main>
    <div class="crumb" id="crumb"></div>
    <div class="grid" id="grid"></div>
    <div class="legend">🔗 关系链路：网站卡「部署于」→ 点虚机名跳到虚机 → 虚机卡「宿主」→ 回物理机</div>
  </main>
</div>
<script>
/* ── 模拟数据 ── */
const CATS = [
  ["代码仓库","#1677ff"],["CI/CD","#722ed1"],["监控告警","#fa8c16"],["文档协作","#eb2f96"],
];
const SITES = [
  {name:"GitLab",cat:"代码仓库",env:"生产环境",domain:"gitlab.company.com",probe:1,on:"vm-gitlab01"},
  {name:"Nexus 制品私服",cat:"代码仓库",env:"生产环境",domain:"nexus.company.com",probe:1,on:"vm-nexus01"},
  {name:"GitHub 企业镜像",cat:"代码仓库",env:"测试环境",public:"github.example.com"},
  {name:"Jenkins",cat:"CI/CD",env:"生产环境",domain:"jenkins.company.com",probe:1,on:"vm-jenkins01"},
  {name:"ArgoCD",cat:"CI/CD",env:"生产环境",domain:"argocd.company.com",probe:1},
  {name:"SonarQube",cat:"CI/CD",env:"生产环境",domain:"sonar.company.com",on:"vm-sonar01"},
  {name:"GitLab Runner",cat:"CI/CD",env:"测试环境",inner:"http://10.0.2.23"},
  {name:"Grafana",cat:"监控告警",env:"生产环境",domain:"grafana.company.com",probe:1,on:"vm-grafana01"},
  {name:"Prometheus",cat:"监控告警",env:"生产环境",inner:"http://10.0.3.30:9090",probe:1,on:"vm-grafana01"},
  {name:"Zabbix",cat:"监控告警",env:"生产环境",domain:"zabbix.company.com",probe:1,on:"vm-zabbix01"},
  {name:"Confluence",cat:"文档协作",env:"生产环境",domain:"wiki.company.com",probe:1},
];
const CLOUDS = [
  {name:"OSS-日志归档",kind:"对象存储 OSS",env:"生产环境",remark:"bucket: company-log-archive"},
  {name:"OSS-前端静态资源",kind:"对象存储 OSS",env:"生产环境",remark:"bucket: company-web-static"},
  {name:"RDS-订单库",kind:"数据库 RDS",env:"生产环境",remark:"MySQL 8.0 高可用版"},
  {name:"RDS-报表库",kind:"数据库 RDS",env:"生产环境",remark:"MySQL 5.7 基础版"},
];
const PHYS = [
  {name:"pve-node01",ip:"10.0.100.11",spec:"2×Xeon 4310 · 256G",os:"Proxmox VE 8",vms:["vm-gitlab01","vm-jenkins01","vm-grafana01"]},
  {name:"pve-node02",ip:"10.0.100.12",spec:"2×Xeon 4310 · 256G",os:"Proxmox VE 8",vms:["vm-nexus01","vm-sonar01"]},
  {name:"esxi-host01",ip:"10.0.100.21",spec:"2×EPYC 7302 · 512G",os:"ESXi 7.0",vms:["vm-rds-proxy","vm-zabbix01"]},
];
const VMS = {
  "vm-gitlab01":{ip:"10.0.1.10",os:"Ubuntu 22.04",runs:"GitLab"},
  "vm-jenkins01":{ip:"10.0.2.20",os:"Ubuntu 22.04",runs:"Jenkins"},
  "vm-grafana01":{ip:"10.0.3.30",os:"Debian 12",runs:"Grafana / Prometheus"},
  "vm-nexus01":{ip:"10.0.1.11",os:"Rocky 9",runs:"Nexus"},
  "vm-sonar01":{ip:"10.0.2.22",os:"Rocky 9",runs:"SonarQube"},
  "vm-rds-proxy":{ip:"10.0.4.41",os:"AlmaLinux 9",runs:"Redis 管理"},
  "vm-zabbix01":{ip:"10.0.3.35",os:"Ubuntu 22.04",runs:"Zabbix Server"},
};
let active = "all";          // all | cat:xx | phys:xx | vm:xx
const physOf = vm => PHYS.find(p => p.vms.includes(vm));
const $ = id => document.getElementById(id);
const esc = s => (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ── 左侧树 ── */
function renderTree() {
  const catCount = c => SITES.filter(s=>s.cat===c).length;
  let h = `<div class="group-label">总览</div>
    <div class="node ${active==="all"?"active":""}" onclick="go('all')"><span class="twist"></span>🗂 全部资产
      <span class="n-count">${SITES.length+CLOUDS.length+PHYS.length}</span></div>`;
  h += `<div class="group-label">网站服务</div>`;
  CATS.forEach(([c,color]) => h += `<div class="node lvl2 ${active==="cat:"+c?"active":""}" onclick="go('cat:${esc(c)}')">
    <span class="twist"></span><span style="width:8px;height:8px;border-radius:50%;background:${color};flex-shrink:0"></span>
    <span class="n-name">${esc(c)}</span><span class="n-count">${catCount(c)}</span></div>`);
  h += `<div class="group-label">云资源（阿里云）</div>`;
  const kinds = [...new Set(CLOUDS.map(c=>c.kind))];
  kinds.forEach(k => h += `<div class="node lvl2" onclick="alert('示意：过滤 ${esc(k)}')">
    <span class="twist"></span>☁️ <span class="n-name">${esc(k)}</span>
    <span class="n-count">${CLOUDS.filter(c=>c.kind===k).length}</span></div>`);
  h += `<div class="group-label">服务器资产</div>`;
  PHYS.forEach(p => {
    const on = active==="phys:"+p.name;
    h += `<div class="node lvl2 ${on?"active":""}" onclick="go('phys:${p.name}')">
      <span class="twist">🖥</span><span class="n-name">${p.name}</span>
      <span class="n-count">${p.vms.length} 虚机</span></div>`;
    if (on) p.vms.forEach(v => h += `<div class="node lvl3 ${active==="vm:"+v?"active":""}" onclick="event.stopPropagation();go('vm:${v}')">
      <span class="twist">·</span><span class="n-name">${v}</span></div>`);
  });
  $("tree").innerHTML = h;
}
function go(k){ active=k; render(); }

/* ── 卡片 ── */
function siteCard(s){
  const color=(CATS.find(c=>c[0]===s.cat)||[,"#999"])[1];
  return `<div class="card" style="border-top-color:${color}">
    <div class="card-header"><span class="card-name">${esc(s.name)}</span>
      <span class="tag t-type" style="background:${color}">网站</span>
      <span class="tag ${s.env==="生产环境"?"t-prod":"t-test"}">${s.env}</span>
      ${s.probe?'<span class="probe-tag">📡 已监控</span>':""}</div>
    ${s.domain?kv("域名",s.domain):""}${s.public?kv("公网",s.public):""}${s.inner?kv("内网",s.inner):""}
    ${s.on?`<div class="deploy-row">🚀 部署于 <b onclick="go('vm:${s.on}')">${s.on}</b></div>`:""}</div>`;
}
function cloudCard(c){
  return `<div class="card" style="border-top-color:#52c41a">
    <div class="card-header"><span class="card-name">${esc(c.name)}</span>
      <span class="tag t-type" style="background:#52c41a">云资源</span>
      <span class="tag t-prod">${c.env}</span></div>
    ${kv("类型",c.kind)}${c.remark?kv("标识",c.remark):""}</div>`;
}
function physCard(p){
  const vms = p.vms.map(v => `<div class="vm-chip" onclick="go('vm:${v}')"><b>💠 ${v}</b><span>${VMS[v].ip} · ${esc(VMS[v].runs)}</span></div>`).join("");
  return `<div class="card phys"><div class="card-header"><span class="card-name">${p.name}</span>
      <span class="tag t-type" style="background:#fa541c">物理机</span></div>
    ${kv("IP",p.ip)}${kv("配置",p.spec)}${kv("系统",p.os)}
    <div class="vm-zone"><div class="vm-zone-title">▼ 承载虚拟机 (${p.vms.length}) —— 点虚机查看详情</div>${vms}</div></div>`;
}
function vmCard(v){
  const m=VMS[v], p=physOf(v);
  const running = SITES.filter(s=>s.on===v).map(s=>esc(s.name)).join("、")||"—";
  return `<div class="card" style="border-top-color:#722ed1">
    <div class="card-header"><span class="card-name">${v}</span>
      <span class="tag t-type" style="background:#722ed1">虚拟机</span></div>
    ${kv("IP",m.ip)}${kv("系统",m.os)}${kv("宿主",`<b style="cursor:pointer;color:#fa541c" onclick="go('phys:${p.name}')">${p.name}</b>`)}
    ${kv("运行服务",running)}</div>`;
}
function kv(k,v){ return `<div class="kv"><b>${k}</b><span>${v}</span></div>`; }

/* ── 渲染 ── */
function render(){
  renderTree();
  let cards=[], crumb="";
  if(active==="all"){
    crumb="全部资产";
    cards=[...PHYS.map(physCard), ...SITES.map(siteCard), ...CLOUDS.map(cloudCard)];
  } else if(active.startsWith("cat:")){
    const c=active.slice(4); crumb=`网站服务 / ${c}`;
    cards=SITES.filter(s=>s.cat===c).map(siteCard);
  } else if(active.startsWith("phys:")){
    const n=active.slice(5), p=PHYS.find(x=>x.name===n);
    crumb=`服务器资产 / ${n}`;
    cards=[physCard(p), ...p.vms.map(vmCard)];
  } else if(active.startsWith("vm:")){
    crumb=`服务器资产 / ${physOf(active.slice(3)).name} / ${active.slice(3)}`;
    cards=[vmCard(active.slice(3))];
  }
  $("crumb").textContent="当前位置："+crumb;
  $("grid").innerHTML=cards.join("");
}
render();
</script>
</body>
</html>
